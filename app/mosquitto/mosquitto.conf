# Mosquitto configuration — authenticated, with per-identity ACLs.
# Anonymous access is disabled; every client must present valid credentials.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain listener — intended for local services on the same host (loopback traffic).
listener 1883

# TLS listener for real devices over the network. Generate certs with gen-certs.sh,
# then uncomment these four lines and restart the broker.
# listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
