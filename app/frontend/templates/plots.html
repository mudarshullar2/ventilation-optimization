<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality History</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f5f7fa; color: #1b1f24; }
        header { padding: 20px 24px; border-bottom: 1px solid #e3e8ef; background: #fff; }
        header h1 { margin: 0; font-size: 20px; }
        .container { padding: 24px; max-width: 1100px; margin: 0 auto; }
        .rooms a { margin-right: 12px; font-size: 14px; text-decoration: none; color: #1a73e8; }
        .rooms a.active { font-weight: 700; color: #1b1f24; }
        .plot { background: #fff; border: 1px solid #e3e8ef; border-radius: 10px; margin: 16px 0; padding: 8px; }
        .nav a { color: #1a73e8; text-decoration: none; font-size: 14px; }
        .empty { color: #5b6472; }
    </style>
</head>
<body>
    <header>
        <h1>Air Quality History &mdash; last 24h</h1>
        <div class="nav"><a href="/">&larr; Dashboard</a></div>
    </header>
    <div class="container">
        <div class="rooms">
            {% for r in rooms %}
                <a href="/plots?room={{ r }}" class="{{ 'active' if r == room else '' }}">{{ r.replace('_', ' ') }}</a>
            {% endfor %}
        </div>

        {% if history %}
            <div id="co2-plot" class="plot"></div>
            <div id="pm25-plot" class="plot"></div>
            <div id="voc-plot" class="plot"></div>
            <div id="temperature-plot" class="plot"></div>
            <div id="humidity-plot" class="plot"></div>

            <script>
                const history = {{ history | tojson | safe }};
                const t = history.map(r => r.ts);
                const meta = {{ metric_meta | tojson | safe }};

                function draw(metric, elementId) {
                    const y = history.map(r => r[metric]);
                    Plotly.newPlot(elementId, [{
                        x: t, y: y, mode: 'lines', type: 'scatter',
                        name: meta[metric][0],
                        line: { color: '#1a73e8' }, fill: 'tozeroy',
                        fillcolor: 'rgba(26,115,232,0.08)'
                    }], {
                        title: meta[metric][0] + ' (' + meta[metric][1] + ')',
                        margin: { t: 40, r: 20, b: 40, l: 50 },
                        xaxis: { title: 'Time' }
                    }, { responsive: true });
                }

                draw('co2', 'co2-plot');
                draw('pm25', 'pm25-plot');
                draw('voc', 'voc-plot');
                draw('temperature', 'temperature-plot');
                draw('humidity', 'humidity-plot');
            </script>
        {% else %}
            <p class="empty">No history for this room yet.</p>
        {% endif %}
    </div>
</body>
</html>
