# Local development infrastructure for the air-quality app.
#   docker compose -f docker-compose.dev.yml up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ventilation
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
